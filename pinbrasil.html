<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>PinBrasil — Inspire-se</title>
<style>
:root{--red:#e60023;--bg:#fff;--text:#222;--muted:#767676;--card:#f5f5f5;--line:#e9e9e9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}button{border:0;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px}
.nav{display:flex;align-items:center;gap:9px}.logo{font-weight:900;font-size:22px;color:var(--red);min-width:74px}
.search{flex:1;background:#eee;border-radius:24px;display:flex;align-items:center;padding:0 14px;height:43px}
.search span{font-size:19px}.search input{border:0;outline:0;background:transparent;width:100%;padding:8px}
.icon{background:#fff;font-size:23px;padding:5px;border-radius:50%}.avatar{width:35px;height:35px;border-radius:50%;background:#222;color:#fff;display:grid;place-items:center;font-weight:bold}
.tabs{display:flex;gap:8px;margin-top:10px;overflow:auto}.tab{padding:8px 15px;border-radius:20px;background:#eee;white-space:nowrap}.tab.active{background:#222;color:#fff}
main{padding:12px 9px 88px}.grid{columns:2 150px;column-gap:10px}.pin{break-inside:avoid;margin:0 0 12px;border-radius:15px;overflow:hidden;background:#f2f2f2;position:relative;box-shadow:0 1px 3px #0001}
.pin img{display:block;width:100%;height:auto}.pin .info{padding:9px}.title{font-weight:700;font-size:14px}.meta{font-size:12px;color:var(--muted);margin-top:5px}.save{position:absolute;right:8px;top:8px;background:var(--red);color:#fff;border-radius:22px;padding:9px 12px;font-weight:bold;opacity:0;transition:.2s}.pin:hover .save,.pin:focus-within .save{opacity:1}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);height:64px;display:flex;justify-content:space-around;align-items:center;z-index:30}.bottom button{background:transparent;font-size:23px}.bottom .add{background:#222;color:#fff;width:48px;height:48px;border-radius:50%}
.sheet,.modal{position:fixed;inset:0;background:#0007;z-index:50;display:none;align-items:flex-end;justify-content:center}.sheet.show,.modal.show{display:flex}.panel{background:#fff;width:100%;max-width:620px;border-radius:25px 25px 0 0;padding:20px;max-height:90vh;overflow:auto}.panel h2{margin-top:0}.close{float:right;background:#eee;border-radius:50%;width:35px;height:35px}
form{display:grid;gap:12px}.field{padding:13px;border:1px solid #ddd;border-radius:12px;width:100%;outline:0}.primary{background:var(--red);color:#fff;border-radius:12px;padding:13px;font-weight:bold}.preview{width:100%;max-height:260px;object-fit:cover;border-radius:15px;display:none}
.empty{text-align:center;padding:40px;color:var(--muted)}
.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 17px;border-radius:22px;z-index:100;display:none}
.toast.show{display:block}
.profile{display:flex;gap:15px;align-items:center}.bigavatar{width:70px;height:70px;border-radius:50%;background:#222;color:#fff;display:grid;place-items:center;font-size:28px}
.stats{display:flex;gap:20px;margin:18px 0}.stats b{display:block}.stats span{font-size:12px;color:#777}
@media(min-width:700px){.grid{columns:4 180px}.bottom{display:none}main{max-width:1200px;margin:auto}.top{padding-left:20px;padding-right:20px}}
</style>
</head>
<body>
<header class="top">
 <div class="nav">
  <div class="logo">● PinBrasil</div>
  <div class="search"><span>⌕</span><input id="search" placeholder="Pesquisar ideias, imagens..."></div>
  <button class="icon" onclick="openProfile()">♙</button><div class="avatar">J</div>
 </div>
 <div class="tabs">
  <button class="tab active" data-cat="Todos">Todos</button>
  <button class="tab" data-cat="Brasil">Brasil</button><button class="tab" data-cat="Viagens">Viagens</button>
  <button class="tab" data-cat="Casa">Casa</button><button class="tab" data-cat="Natureza">Natureza</button>
  <button class="tab" data-cat="Comida">Comida</button><button class="tab" data-cat="Arte">Arte</button>
 </div>
</header>

<main><div id="grid" class="grid"></div><div id="empty" class="empty" style="display:none">Nenhum pin encontrado.</div></main>

<nav class="bottom">
 <button onclick="setCategory('Todos')">⌂</button><button onclick="document.getElementById('search').focus()">⌕</button>
 <button class="add" onclick="openCreate()">＋</button><button onclick="showSaved()">♡</button><button onclick="openProfile()">♙</button>
</nav>

<div id="create" class="sheet">
 <section class="panel">
  <button class="close" onclick="closeCreate()">×</button><h2>Criar um Pin</h2>
  <form onsubmit="createPin(event)">
   <input id="pinTitle" class="field" placeholder="Título do pin" required>
   <select id="pinCat" class="field"><option>Brasil</option><option>Viagens</option><option>Casa</option><option>Natureza</option><option>Comida</option><option>Arte</option></select>
   <input id="pinUrl" class="field" placeholder="URL de uma imagem (opcional)">
   <input id="pinFile" class="field" type="file" accept="image/*">
   <img id="preview" class="preview">
   <button class="primary">Publicar Pin</button>
  </form>
 </section>
</div>

<div id="profile" class="sheet"><section class="panel">
 <button class="close" onclick="closeProfile()">×</button>
 <div class="profile"><div class="bigavatar">J</div><div><h2 style="margin:0">Meu Perfil</h2><div style="color:#777">@pinbrasil</div></div></div>
 <div class="stats"><div><b id="countPins">0</b><span>Pins</span></div><div><b id="countSaved">0</b><span>Salvos</span></div><div><b>1</b><span>Seguindo</span></div></div>
 <button class="primary" onclick="closeProfile();showSaved()">Ver meus pins salvos</button>
</section></div>
<div id="toast" class="toast"></div>

<script>
const seed=[
["Brasília moderna","Brasil","https://images.unsplash.com/photo-1585208798174-6cedd86e019a?auto=format&fit=crop&w=800&q=80"],
["Cachoeira na natureza","Natureza","https://images.unsplash.com/photo-1432405972618-c60b0225b8f9?auto=format&fit=crop&w=800&q=80"],
["Casa aconchegante","Casa","https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=800&q=80"],
["Praia tropical","Viagens","https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80"],
["Arte colorida","Arte","https://images.unsplash.com/photo-1549490349-8643362247b5?auto=format&fit=crop&w=800&q=80"],
["Café especial","Comida","https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=800&q=80"],
["Rio de Janeiro","Brasil","https://images.unsplash.com/photo-1483729558449-99ef09a8c325?auto=format&fit=crop&w=800&q=80"],
["Montanhas","Natureza","https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80"]
];
let pins=JSON.parse(localStorage.getItem("pinbrasil_pins")||"null")||seed.map((x,i)=>({id:i,title:x[0],cat:x[1],img:x[2],saved:false}));
let category="Todos", savedOnly=false;

function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=pins.filter(p=>(category==="Todos"||p.cat===category)&&(!savedOnly||p.saved)&&(!q||(p.title+" "+p.cat).toLowerCase().includes(q)));
 document.getElementById("grid").innerHTML=list.map(p=>`
 <article class="pin" tabindex="0">
  <img src="${p.img}" alt="${esc(p.title)}" loading="lazy" onerror="this.style.display='none'">
  <button class="save" onclick="toggleSave(${p.id})">${p.saved?'Salvo':'Salvar'}</button>
  <div class="info"><div class="title">${esc(p.title)}</div><div class="meta">${p.cat} · ♥ ${p.saved?'1':''}</div></div>
 </article>`).join("");
 document.getElementById("empty").style.display=list.length?"none":"block";
 document.getElementById("countPins").textContent=pins.length;
 document.getElementById("countSaved").textContent=pins.filter(p=>p.saved).length;
 localStorage.setItem("pinbrasil_pins",JSON.stringify(pins));
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toggleSave(id){let p=pins.find(x=>x.id===id);p.saved=!p.saved;toast(p.saved?"Pin salvo!":"Pin removido dos salvos");render()}
function setCategory(c){category=c;savedOnly=false;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.cat===c));render()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setCategory(b.dataset.cat));
document.getElementById("search").oninput=render;
function showSaved(){savedOnly=true;category="Todos";document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.cat==="Todos"));render();toast("Mostrando pins salvos")}
function openCreate(){document.getElementById("create").classList.add("show")}
function closeCreate(){document.getElementById("create").classList.remove("show")}
function openProfile(){document.getElementById("profile").classList.add("show");render()}
function closeProfile(){document.getElementById("profile").classList.remove("show")}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}
document.getElementById("pinFile").onchange=e=>{let f=e.target.files[0];if(f){let r=new FileReader();r.onload=()=>{preview.src=r.result;preview.style.display="block"};r.readAsDataURL(f)}};
function createPin(e){e.preventDefault();let title=pinTitle.value.trim(),cat=pinCat.value,img=preview.src||pinUrl.value.trim();if(!img)img="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80";pins.unshift({id:Date.now(),title,cat,img,saved:false});e.target.reset();preview.style.display="none";closeCreate();render();toast("Seu Pin foi publicado!")}
render();
</script>
</body>
</html>
